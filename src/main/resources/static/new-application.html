<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GrantTrack - New Application</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                G
            </div>

            <div>

                <h2>GrantTrack</h2>

                <span>
                    Grant Management
                </span>

            </div>

        </div>


        <nav>
            <a href="/applications.html" class="nav-item"><span>▤</span> My Applications</a>
            <a href="/new-application.html" class="nav-item active"><span>＋</span> New Application</a>
            <a href="/expenditures.html" class="nav-item"><span>₹</span> Expenditures</a>
        </nav>


        <div class="sidebar-bottom">

            <div class="system-status">

                <span class="status-dot"></span>

                System Online

            </div>

        </div>

    </aside>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">


        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <p class="welcome-text">
                    Grant Management
                </p>

                <h1>
                    New Application
                </h1>

            </div>


            <div class="profile">

                <div class="notification">
                    🔔
                </div>


                <div class="profile-avatar">
                    A
                </div>


                <div class="profile-info">

                    <strong>
                        Administrator
                    </strong>

                    <span>
                        Grant Manager
                    </span>

                </div>

            </div>

        </header>



        <!-- ================= FORM ================= -->

        <section class="overview-section">


            <div class="section-header">

                <div>

                    <p class="section-label">
                        APPLICATION MANAGEMENT
                    </p>

                    <h2>
                        Create New Grant Application
                    </h2>

                </div>

            </div>



            <div class="info-panel">


                <form id="applicationForm">


                    <!-- FACULTY INFO (shown for faculty, filled from their profile) -->

                    <div class="form-group" id="facultyInfoGroup">
                        <label>Your Details</label>
                        <div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:16px;line-height:2;">
                            <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px;">
                                <strong style="min-width:100px;">Name:</strong>
                                <span id="displayName" style="color:#374151;">—</span>
                            </div>
                            <div class="form-group" style="margin-bottom:10px;">
                                <label for="facultyDept">Department</label>
                                <input type="text" id="facultyDept" placeholder="e.g. Computer Science" required>
                            </div>
                            <div class="form-group" style="margin-bottom:0;">
                                <label for="facultyEmail">Email</label>
                                <input type="email" id="facultyEmail" placeholder="e.g. name@university.edu" required>
                            </div>
                        </div>
                    </div>


                    <!-- TITLE -->

                    <div class="form-group">

                        <label for="title">
                            Application Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter application title"
                            required>

                    </div>



                    <!-- ABSTRACT -->

                    <div class="form-group">

                        <label for="abstractText">
                            Abstract
                        </label>

                        <textarea
                            id="abstractText"
                            name="abstractText"
                            rows="5"
                            placeholder="Enter project abstract"
                            required></textarea>

                    </div>



                    <!-- REQUESTED AMOUNT -->

                    <div class="form-group">

                        <label for="requestedAmount">
                            Requested Amount (₹)
                        </label>

                        <input
                            type="number"
                            id="requestedAmount"
                            name="requestedAmount"
                            min="1"
                            step="0.01"
                            placeholder="Enter requested amount"
                            required>

                    </div>



                    <!-- SUBMIT BUTTONS -->

                    <div
                        style="
                            margin-top:25px;
                            display:flex;
                            gap:12px;
                        ">


                        <button
                            type="submit"
                            style="
                                background:#2563eb;
                                color:white;
                                border:none;
                                padding:12px 24px;
                                border-radius:8px;
                                cursor:pointer;
                                font-weight:600;
                            ">

                            Create Application

                        </button>


                        <button
                            type="button"
                            onclick="window.location.href='/applications.html'"
                            style="
                                background:#e5e7eb;
                                color:#374151;
                                border:none;
                                padding:12px 24px;
                                border-radius:8px;
                                cursor:pointer;
                                font-weight:600;
                            ">

                            Cancel

                        </button>


                    </div>



                    <!-- MESSAGE -->

                    <div
                        id="message"
                        style="
                            margin-top:20px;
                            font-weight:600;
                        ">

                    </div>


                </form>


            </div>


        </section>



        <!-- ================= FOOTER ================= -->

        <footer>

            <span>
                GrantTrack © 2026
            </span>

            <span>
                Grant Management System
            </span>

        </footer>


    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="/auth.js"></script>
    <script>

        function waitForUser(callback) {
            if (window.grantTrackUser) callback(window.grantTrackUser);
            else setTimeout(() => waitForUser(callback), 50);
        }

        waitForUser(function(user) {
            document.getElementById("displayName").textContent = user.name || "—";
            document.getElementById("applicationForm")
                .addEventListener("submit", createApplication);
        });

        async function createApplication(event) {
            event.preventDefault();
            const message = document.getElementById("message");
            message.textContent = "Creating application...";
            message.style.color = "#2563eb";

            const user = window.grantTrackUser;
            const title = document.getElementById("title").value.trim();
            const abstractText = document.getElementById("abstractText").value.trim();
            const requestedAmount = Number(document.getElementById("requestedAmount").value);
            const department = document.getElementById("facultyDept").value.trim();
            const email = document.getElementById("facultyEmail").value.trim();

            if (!title || !abstractText || !requestedAmount || !department || !email) {
                message.textContent = "Please fill in all fields.";
                message.style.color = "#dc2626";
                return;
            }

            try {
                // Update faculty department and email first
                await fetch("/api/faculty/" + user.facultyId, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: user.name, department, email })
                });

                // Create the application
                const response = await fetch("/api/applications", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, abstractText, requestedAmount })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || "Failed to create application");

                message.textContent = "Application created successfully!";
                message.style.color = "#15803d";
                setTimeout(() => window.location.href = "/applications.html", 1000);
            } catch (error) {
                message.textContent = error.message || "Something went wrong.";
                message.style.color = "#dc2626";
            }
        }

    </script>
</body>
</html>
