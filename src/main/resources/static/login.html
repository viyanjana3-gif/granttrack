<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrantTrack - Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <a class="login-brand" href="/login.html" aria-label="GrantTrack login">
            <span class="logo-icon">G</span>
            <span><strong>GrantTrack</strong><small>Grant Management System</small></span>
        </a>

        <section class="login-card" aria-labelledby="loginTitle">
            <p class="section-label">SECURE ACCESS</p>
            <h1 id="loginTitle">Sign in to GrantTrack</h1>
            <p class="login-subtitle">Choose your account type to continue.</p>

            <div class="login-tabs" role="group" aria-label="Account type">
                <button type="button" class="login-tab active" data-role="FACULTY">Faculty Login</button>
                <button type="button" class="login-tab" data-role="ADMIN">Administrator Login</button>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group" id="facultyFields">
                    <label for="facultyName">Faculty Name</label>
                    <input id="facultyName" name="name" type="text" autocomplete="name" placeholder="Enter your name" required>
                </div>

                <div id="adminFields" hidden>
                    <div class="form-group">
                        <label for="adminUsername">Administrator Username</label>
                        <input id="adminUsername" name="username" type="text" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">Password</label>
                        <input id="adminPassword" name="password" type="password" autocomplete="current-password">
                    </div>
                </div>

                <p id="loginMessage" class="form-message" role="alert"></p>
                <button class="primary-button login-submit" type="submit">Login</button>
            </form>
        </section>
        <p class="login-footer">GrantTrack · Grant Management</p>
    </main>

    <script>
        let selectedRole = "FACULTY";

        const loginForm = document.getElementById("loginForm");
        const facultyFields = document.getElementById("facultyFields");
        const adminFields = document.getElementById("adminFields");
        const loginMessage = document.getElementById("loginMessage");

        document.querySelectorAll(".login-tab").forEach(button => {
            button.addEventListener("click", () => {
                selectedRole = button.dataset.role;
                document.querySelectorAll(".login-tab").forEach(tab =>
                    tab.classList.toggle("active", tab === button));
                facultyFields.hidden = selectedRole !== "FACULTY";
                adminFields.hidden = selectedRole !== "ADMIN";
                document.getElementById("facultyName").required = selectedRole === "FACULTY";
                document.getElementById("adminUsername").required = selectedRole === "ADMIN";
                document.getElementById("adminPassword").required = selectedRole === "ADMIN";
                loginMessage.textContent = "";
            });
        });

        loginForm.addEventListener("submit", async event => {
            event.preventDefault();
            const request = { role: selectedRole };
            if (selectedRole === "FACULTY") {
                request.name = document.getElementById("facultyName").value.trim();
            } else {
                request.username = document.getElementById("adminUsername").value.trim();
                request.password = document.getElementById("adminPassword").value;
            }

            loginMessage.textContent = "Signing in...";
            loginMessage.classList.remove("error");
            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(request)
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || "Login failed");
                window.location.replace(result.role === "ADMIN"
                    ? "/index.html"
                    : "/applications.html");
            } catch (error) {
                loginMessage.textContent = error.message;
                loginMessage.classList.add("error");
            }
        });
    </script>
</body>
</html>
